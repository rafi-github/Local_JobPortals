# Post-fix re-runs stay on the owner PC. This workflow must not call the Cursor API.
name: Post-fix daily re-run

on:
  workflow_dispatch:
    inputs:
      portal:
        description: Portal to re-run locally on the Windows PC
        required: true
        type: choice
        options:
          - linkedin
          - foundit
          - cutshort
          - naukri
          - instahyre
          - indeed
          - hirist
          - hitechcity
          - notification
          - hotels

jobs:
  launch:
    runs-on: ubuntu-latest
    steps:
      - name: Do not launch a cloud agent
        run: |
          echo "Cursor cloud re-run is disabled for ${{ inputs.portal }}."
          echo "On the Windows PC run: bash scripts/portal-home-daily.sh ${{ inputs.portal }}"
          echo "No Cursor API key is read and no agent is started."
