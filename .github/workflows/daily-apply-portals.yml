# Daily applies run on the owner PC via Windows Task Scheduler
# (scripts/install-all-home-tasks.ps1 → scripts/run-all-home-now.sh).
# This workflow must not call the Cursor API.
name: Daily Apply Portals

on:
  workflow_dispatch:

jobs:
  launch-daily:
    runs-on: ubuntu-latest
    steps:
      - name: Local scheduler owns the daily run
        run: |
          echo "Cursor cloud launch is disabled."
          echo "Daily applies run on the Windows PC task LocalJobPortals-Daily."
          echo "No Cursor API key is read and no agent is started."
